spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${PAYMENT_DB_USERNAME:postgres}
    password: ${PAYMENT_DB_PASSWORD:pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:showhub}
    password: ${RABBITMQ_PASSWORD:showhub}
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  port: ${SERVER_PORT:8083}

showhub:
  internal:
    api-key: ${SHOWHUB_INTERNAL_API_KEY}
    booking-service-url: ${BOOKING_SERVICE_INTERNAL_URL:http://localhost:8082}
  security:
    local:
      issuer: ${SHOWHUB_JWT_ISSUER:https://showhub.local/user-service}
      audience: ${SHOWHUB_JWT_AUDIENCE:showhub-api}
      jwt-signing-key: ${SHOWHUB_JWT_SIGNING_KEY}
  payment:
    sandbox:
      webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
      checkout-base-url: ${PAYMENT_CHECKOUT_BASE_URL:http://localhost:8083/sandbox/checkout}
      webhook-tolerance: ${PAYMENT_WEBHOOK_TOLERANCE:PT5M}
  payment-events:
    enabled: ${SHOWHUB_PAYMENT_OUTBOX_ENABLED:true}
    exchange: ${SHOWHUB_PAYMENT_EXCHANGE:showhub.payments}
    routing-key: ${SHOWHUB_PAYMENT_ROUTING_KEY:payment.status.changed}
    queue: ${SHOWHUB_PAYMENT_BOOKING_QUEUE:showhub.booking.payment-status}
    dead-letter-exchange: ${SHOWHUB_PAYMENT_DLX:showhub.payment.dlx}
    dead-letter-queue: ${SHOWHUB_PAYMENT_BOOKING_DLQ:showhub.booking.payment-status.dlq}
    relay-delay: ${SHOWHUB_PAYMENT_OUTBOX_RELAY_DELAY:PT1S}
    claim-timeout: ${SHOWHUB_PAYMENT_OUTBOX_CLAIM_TIMEOUT:PT1M}
    confirm-timeout: ${SHOWHUB_PAYMENT_OUTBOX_CONFIRM_TIMEOUT:PT10S}
    initial-retry-delay: ${SHOWHUB_PAYMENT_OUTBOX_INITIAL_RETRY_DELAY:PT1S}
    max-retry-delay: ${SHOWHUB_PAYMENT_OUTBOX_MAX_RETRY_DELAY:PT5M}
    batch-size: ${SHOWHUB_PAYMENT_OUTBOX_BATCH_SIZE:50}

management:
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
