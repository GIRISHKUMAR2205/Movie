spring:
  application:
    name: mail-service
  datasource:
    url: ${MAIL_DB_URL:jdbc:postgresql://localhost:5432/mail_db}
    username: ${MAIL_DB_USERNAME:postgres}
    password: ${MAIL_DB_PASSWORD:pass}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:girish}
    password: ${RABBITMQ_PASSWORD:rabbit123}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000ms
          multiplier: 2
          max-retries: 5

server:
  port: ${SERVER_PORT:8085}

showhub:
  mail:
    exchange: ${SHOWHUB_MAIL_EXCHANGE:showhub.events}
    routing-key: ${SHOWHUB_MAIL_ROUTING_KEY:email.verification.requested}
    queue: ${SHOWHUB_MAIL_QUEUE:showhub.mail.email}
    dead-letter-exchange: ${SHOWHUB_MAIL_DLX:showhub.mail.dlx}
    dead-letter-queue: ${SHOWHUB_MAIL_DLQ:showhub.mail.email.dlq}
    from: ${SHOWHUB_MAIL_FROM:no-reply@showhub.local}

management:
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
