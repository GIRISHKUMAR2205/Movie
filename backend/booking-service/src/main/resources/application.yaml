spring:
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5432/booking_db}
    username: ${BOOKING_DB_USERNAME:postgres}
    password: ${BOOKING_DB_PASSWORD:pass}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:showhub}
    password: ${RABBITMQ_PASSWORD:showhub}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 5
          multiplier: 2
          max-interval: 10s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8082}

showhub:
  security:
    local:
      issuer: ${SHOWHUB_JWT_ISSUER:https://showhub.local/user-service}
      audience: ${SHOWHUB_JWT_AUDIENCE:showhub-api}
      jwt-signing-key: ${SHOWHUB_JWT_SIGNING_KEY}
  internal:
    api-key: ${SHOWHUB_INTERNAL_API_KEY}
    theater-service-url: ${THEATER_SERVICE_INTERNAL_URL:http://localhost:8087/theaters}
    owner-header: X-ShowHub-Owner
  booking:
    hold-ttl: ${BOOKING_HOLD_TTL:PT10M}
    payment-ttl: ${BOOKING_PAYMENT_TTL:PT30M}
    max-seats-per-booking: ${BOOKING_MAX_SEATS:10}
    expiry-batch-size: ${BOOKING_EXPIRY_BATCH_SIZE:100}
    expiry-scan-delay: ${BOOKING_EXPIRY_SCAN_DELAY:PT1S}
  payment-events:
    exchange: ${SHOWHUB_PAYMENT_EXCHANGE:showhub.payments}
    routing-key: ${SHOWHUB_PAYMENT_ROUTING_KEY:payment.status.changed}
    queue: ${SHOWHUB_PAYMENT_BOOKING_QUEUE:showhub.booking.payment-status}
    dead-letter-exchange: ${SHOWHUB_PAYMENT_DLX:showhub.payment.dlx}
    dead-letter-queue: ${SHOWHUB_PAYMENT_BOOKING_DLQ:showhub.booking.payment-status.dlq}

management:
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
