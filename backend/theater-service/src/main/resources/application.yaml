spring:
  application:
    name: theater-service
  datasource:
    url: ${THEATER_DB_URL:jdbc:postgresql://localhost:5432/theater_db}
    username: ${THEATER_DB_USERNAME:postgres}
    password: ${THEATER_DB_PASSWORD:pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8087}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/theaters}

showhub:
  internal:
    api-key: ${SHOWHUB_INTERNAL_API_KEY}
    currency: ${SHOWHUB_BOOKING_CURRENCY:INR}
  security:
    local:
      issuer: ${SHOWHUB_JWT_ISSUER:https://showhub.local/user-service}
      audience: ${SHOWHUB_JWT_AUDIENCE:showhub-api}
      jwt-signing-key: ${SHOWHUB_JWT_SIGNING_KEY}

management:
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
