springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger.html
logging:
  level:
    root: info
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE
  file:
    path: /home/girish/Projects/backend/user-service/logs
frontend:
  app:
    base-url: http://localhost:3000
    oauth2-redirect-url: ${frontend.app.base-url}/dashboard
