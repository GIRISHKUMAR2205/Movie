<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f2f2f2;
        }

        .login-container{
            width:350px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,.2);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        .form-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:10px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0056b3;
        }
        .google-btn{
    margin-top:15px;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    padding:10px;
    border:1px solid #ddd;
    border-radius:5px;
    text-decoration:none;
    color:#333;
    font-weight:bold;
    background:white;
    transition:0.3s;
}

.google-btn:hover{
    background:#f5f5f5;
}
    </style>
    <script>document.addEventListener("DOMContentLoaded", () => {
    document.querySelector("form").addEventListener("submit", async function(e) {
        e.preventDefault();

        const email = document.querySelector("[name='email']").value;
        const password = document.querySelector("[name='password']").value;

        const response = await fetch("/users/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email,
                password
            })
        });

        const result = await response.text();
        alert(result);
    });
});
</script>
</head>
<body>

<div class="login-container">
    <h2>Login</h2>

    <form action="/users/login" method="post">

        <div class="form-group">
            <label>Username</label>
            <input
                    type="text"
                    name="email"
                    placeholder="Enter username"
                    required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required>
        </div>

        <button type="submit">Login</button>
    </form>
    <hr style="margin:20px 0;">
<a href="/users/oauth2/authorization/google" class="google-btn">
    Sign in with Google
</a>
</div>

</body>
</html>
